# Native file-rule wrapper, not a Caddy-side rule engine.
# Extract the SHA-256 verified archive in pins.json beneath CrowdSec's data_dir
# as coreruleset-4.30.0/. Copy its crs-setup.conf.example to crs-setup.conf and
# review/record that configuration's checksum. Copy verified rules/*.data files
# to the ROOT of data_dir: CrowdSec flattens rule text before Coraza loads it.
# Native data declarations below use immutable commit URLs for the same bytes.
# See pins.json for the exact archive; never use Hub's floating CRS data URLs.
# Native engine loading/regression acceptance is required before production use.
name: trueops/crs-v4.30
seclang_rules:
  - SecRuleEngine On
  - SecRequestBodyAccess On
seclang_files_rules:
  - coreruleset-4.30.0/crs-setup.conf
  - coreruleset-4.30.0/rules/*.conf
