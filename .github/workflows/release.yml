name: release-linux-binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TRUEOPS_APPSEC_TEST_LOCAL: '0'
  CI: 'true'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  CGO_ENABLED: '0'
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release inputs
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9A-Za-z][0-9A-Za-z.+_-]*$') {
            throw 'Use a v-prefixed tag without path separators or filename metacharacters.'
          }
          foreach ($required in @('go.mod', 'go.sum', 'cmd/caddy/main.go', 'LICENSE', 'THIRD_PARTY_NOTICES', 'scripts/package-notices.ps1')) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Release input missing from tagged source: $required."
            }
          }
          $moduleText = Get-Content -Raw go.mod
          $selectedGo = [regex]::Match($moduleText, '(?m)^toolchain go([^\s]+)\r?$')
          if (-not $selectedGo.Success) {
            $selectedGo = [regex]::Match($moduleText, '(?m)^go ([^\s]+)\r?$')
          }
          if (-not $selectedGo.Success -or $selectedGo.Groups[1].Value -notmatch '^\d+\.\d+\.\d+$') {
            throw 'go.mod must select an exact Go patch version.'
          }

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Verify formatting, dependencies, tests and vet
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          go version
          go mod download
          go mod verify
          $goFiles = @(git ls-files --cached --others --exclude-standard -- '*.go')
          foreach ($goFile in $goFiles) {
            $unformatted = @(gofmt -l $goFile)
            if ($unformatted.Count -gt 0) { throw "Run gofmt on $goFile" }
          }
          go test -v ./...
          go vet ./...
          go build -trimpath ./cmd/caddy
          git diff --exit-code -- go.mod go.sum

      - name: Cross-build Linux candidates and record manifests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $sourceCommit = (git rev-parse HEAD).Trim()
          $toolchain = (go env GOVERSION).Trim()
          $caddyVersion = (go list -m -f '{{.Version}}' github.com/caddyserver/caddy/v2).Trim()
          $dependencyModules = @(go list -m all)
          foreach ($arch in @('amd64', 'arm64')) {
            $candidate = "candidates/$arch"
            New-Item -ItemType Directory -Path $candidate | Out-Null
            $env:GOOS = 'linux'
            $env:GOARCH = $arch
            go build -trimpath -o "$candidate/caddy" ./cmd/caddy
            $binaryHash = (Get-FileHash -Algorithm SHA256 "$candidate/caddy").Hash.ToLowerInvariant()
            go version -m "$candidate/caddy" | Set-Content -Encoding utf8NoBOM "$candidate/build-info.txt"
            ./scripts/package-notices.ps1 -Destination $candidate
            [ordered]@{
              distribution = 'trueops-appsec'
              version = $env:RELEASE_TAG
              source_commit = $sourceCommit
              caddy_version = $caddyVersion
              go_version = $toolchain
              goos = 'linux'
              goarch = $arch
              cgo_enabled = $env:CGO_ENABLED
              build_flags = @('-mod=readonly', '-trimpath')
              modules = $dependencyModules
              binary_sha256 = $binaryHash
            } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8NoBOM "$candidate/manifest.json"
          }
          git diff --exit-code -- go.mod go.sum

      - name: Upload exact candidates for native acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-candidates
          path: candidates/
          if-no-files-found: error
          retention-days: 14

  native:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      TARGET_MACHINE: ${{ matrix.machine }}
    steps:
      - name: Download Windows-built candidates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-candidates
          path: candidates

      - name: Check native binary, serve a request and package accepted bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$TARGET_MACHINE"
          cd "candidates/$TARGET_ARCH"
          binary_hash="$(jq -er .binary_sha256 manifest.json)"
          printf '%s  caddy\n' "$binary_hash" | sha256sum --check --strict
          chmod +x caddy
          ./caddy version
          ./caddy build-info
          ./caddy list-modules
          cat > smoke.json <<'JSON'
          {"admin":{"disabled":true},"apps":{"http":{"servers":{"smoke":{"listen":["127.0.0.1:18080"],"routes":[{"handle":[{"handler":"static_response","body":"ok"}]}]}}}}}
          JSON
          ./caddy validate --config smoke.json
          ./caddy run --config smoke.json > caddy.log 2>&1 &
          caddy_pid=$!
          cleanup() {
            kill "$caddy_pid" 2>/dev/null || true
            wait "$caddy_pid" || true
            cat caddy.log
          }
          trap cleanup EXIT
          curl --fail-with-body --retry 20 --retry-connrefused --retry-delay 1 \
            --max-time 2 --output response.txt http://127.0.0.1:18080/
          test "$(cat response.txt)" = 'ok'
          kill "$caddy_pid"
          wait "$caddy_pid"
          trap - EXIT
          cat caddy.log
          printf '%s  caddy\n' "$binary_hash" | sha256sum --check --strict
          mkdir -p ../../release
          archive="trueops-appsec_${RELEASE_TAG}_linux_${TARGET_ARCH}.tar.gz"
          test -s THIRD_PARTY_NOTICES
          test -s licenses/GO-LICENSE
          tar -czf "../../release/$archive" caddy LICENSE THIRD_PARTY_NOTICES licenses manifest.json build-info.txt
          cp manifest.json "../../release/manifest-linux-${TARGET_ARCH}.json"

      - name: Upload native-checked release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: native
    runs-on: windows-2025
    timeout-minutes: 15
    # Reviewers accept these exact candidate archives; see guides/releasing.md.
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require configured release reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseEnvironment = gh api "repos/$env:GITHUB_REPOSITORY/environments/release" | ConvertFrom-Json
          $reviewers = @($releaseEnvironment.protection_rules | Where-Object {
            $_.type -eq 'required_reviewers' -and $_.reviewers.Count -gt 0
          })
          if ($reviewers.Count -eq 0) {
            throw 'Configure required reviewers on the release environment before publication.'
          }

      - name: Download exact accepted archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: release

      - name: Assemble release manifest and SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $targets = @()
          foreach ($arch in @('amd64', 'arm64')) {
            $archive = "release/trueops-appsec_$($env:RELEASE_TAG)_linux_$arch.tar.gz"
            if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw "Missing $archive" }
            $target = Get-Content -Raw "release/manifest-linux-$arch.json" | ConvertFrom-Json
            if ($target.version -ne $env:RELEASE_TAG -or $target.goarch -ne $arch -or $target.goos -ne 'linux') {
              throw "Candidate identity mismatch: $arch"
            }
            $targets += $target
          }
          $tagCommit = (gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:RELEASE_TAG" --jq '.sha').Trim()
          if (@($targets | Where-Object { $_.source_commit -ne $tagCommit }).Count -gt 0) {
            throw 'The tag no longer identifies the source commit accepted for release.'
          }
          [ordered]@{
            distribution = 'trueops-appsec'
            version = $env:RELEASE_TAG
            source_commit = $tagCommit
            targets = $targets
          } | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8NoBOM release/manifest.json
          $checksumLines = @(Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          })
          $checksumLines | Set-Content -Encoding utf8NoBOM release/SHA256SUMS

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

      - name: Create draft, verify uploaded assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $assetPaths = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          $releaseJson = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --exclude-drafts --exclude-pre-releases --json tagName,publishedAt
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list published GitHub releases.' }
          $releases = @()
          $releaseText = $releaseJson -join "`n"
          if (-not [string]::IsNullOrWhiteSpace($releaseText)) {
            $releases = $releaseText | ConvertFrom-Json
          }
          $previousRelease = $releases |
            Where-Object { $_.tagName -ne $env:RELEASE_TAG } |
            Sort-Object { [DateTime]$_.publishedAt } |
            Select-Object -Last 1
          $releaseNotes = 'Linux amd64 (64-bit Intel/AMD) and arm64 binaries. See manifest.json, SHA256SUMS and GitHub attestations for build identity and provenance.'
          $notesPath = Join-Path $env:RUNNER_TEMP 'trueops-appsec-release-notes.txt'
          $releaseNotes | Set-Content -Encoding utf8NoBOM $notesPath
          $releaseOptions = @('--draft', '--verify-tag', '--repo', $env:GITHUB_REPOSITORY,
            '--title', "TrueOps AppSec $env:RELEASE_TAG", '--notes-file', $notesPath, '--generate-notes')
          if ($previousRelease) {
            Write-Output "Generating release notes from $($previousRelease.tagName) to $env:RELEASE_TAG."
            $releaseOptions += @('--notes-start-tag', $previousRelease.tagName)
          } else {
            Write-Output "No previous published stable release found; using GitHub's default generated notes."
          }
          if ($env:RELEASE_TAG.Contains('-')) { $releaseOptions += '--prerelease' }
          gh release create $env:RELEASE_TAG @assetPaths @releaseOptions
          $verifyDir = Join-Path $env:RUNNER_TEMP 'trueops-appsec-upload-verification'
          New-Item -ItemType Directory -Path $verifyDir | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $verifyDir
          foreach ($asset in Get-ChildItem release -File) {
            $uploaded = Join-Path $verifyDir $asset.Name
            $expected = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset.FullName).Hash
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $uploaded).Hash
            if ($actual -ne $expected) { throw "Uploaded asset mismatch: $($asset.Name)" }
          }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --verify-tag
